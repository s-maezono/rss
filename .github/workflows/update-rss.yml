name: Update RSS

on:
  workflow_dispatch:
    inputs:
      rss_xml:
        description: "RSS XML content"
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write RSS XML
        run: |
          cat > news-9f3b7c2a8d6e4f1b0c9a7e5d2f8a6b4c4e91a73d0f2b8c6a.xml <<'EOF'
          ${{ inputs.rss_xml }}
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add news-9f3b7c2a8d6e4f1b0c9a7e5d2f8a6b4c4e91a73d0f2b8c6a.xml
          git commit -m "Update RSS feed" || exit 0
          git push
